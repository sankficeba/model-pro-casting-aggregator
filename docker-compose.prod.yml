# Production compose: использует готовый image из GHCR.
# Переменная IMAGE задаётся в workflow или прямо в .env на VPS.
services:
  app:
    image: ${IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: tg_parser_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
