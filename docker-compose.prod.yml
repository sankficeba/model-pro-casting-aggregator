# Production compose: использует готовый image из GHCR.
services:
  app:
    image: ${IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: tg_parser_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tg_parser_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_USER: ${POSTGRES_USER:-tg_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_parser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт открыт ТОЛЬКО на localhost VPS — снаружи к нему нельзя достучаться.
    # Чтобы подключиться с локальной машины — используйте SSH-туннель (см. README).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
