# Production compose: использует готовый image из GHCR.
services:
  app:
    image: ${IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: tg_parser_app
    restart: unless-stopped
    command: ["bot"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: tg_parser_api
    restart: unless-stopped
    command: ["api"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    image: ${WEBAPP_IMAGE:-ghcr.io/OWNER/REPO-webapp:latest}
    container_name: tg_parser_webapp
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: tg_parser_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
      - webapp

  postgres:
    image: postgres:16-alpine
    container_name: tg_parser_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_USER: ${POSTGRES_USER:-tg_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_parser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
