services:
  app:
    build: .
    container_name: tg_parser_app
    restart: unless-stopped
    command: ["bot"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: tg_parser_api
    restart: unless-stopped
    command: ["api"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      # для локальной разработки удобно иметь прямой доступ
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    build: ./webapp
    container_name: tg_parser_webapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

  postgres:
    image: postgres:16-alpine
    container_name: tg_parser_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_USER: ${POSTGRES_USER:-tg_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_parser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
