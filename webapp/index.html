<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1326" />
    <title>ModelPro — Анкета</title>
    <!-- Preconnect: открываем TCP+TLS к Telegram SDK в фоне, пока
         парсится HTML. API/webapp — same-origin, отдельный preconnect
         не нужен (но warmup-fetch в main.tsx даст cold-start hit на
         первом запросе). -->
    <link rel="dns-prefetch" href="https://telegram.org" />
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="bg-bg text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
